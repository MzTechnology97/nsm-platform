name: Agent Status Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-status-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: network_platform
          POSTGRES_USER: network_platform
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U network_platform -d network_platform"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: network_platform
      DB_NAME: network_platform
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      APP_SECRET_KEY: ci-app-secret-key-not-for-production
      ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
      SESSION_COOKIE_SECURE: 'false'
      APP_TIMEZONE: Europe/Rome
      BACKUP_STORAGE_ROOT: /tmp/nsm-ci-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - run: cd app && alembic upgrade head
      - name: Run isolated smoke and capture traceback
        continue-on-error: true
        run: |
          cd app
          set +e
          PYTHONPATH=. python tests/mikrotik_agent_status_smoke.py > /tmp/agent-status.log 2>&1
          code=$?
          cat /tmp/agent-status.log
          echo "$code" > /tmp/agent-status-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: agent-status-debug
          path: |
            /tmp/agent-status.log
            /tmp/agent-status-exit.txt
