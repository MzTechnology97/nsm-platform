name: Smoke Suite Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  isolated-suite-debug:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: network_platform
          POSTGRES_USER: network_platform
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U network_platform -d network_platform"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: network_platform
      DB_NAME: network_platform
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      APP_SECRET_KEY: ci-app-secret-key-not-for-production
      ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
      SESSION_COOKIE_SECURE: 'false'
      APP_TIMEZONE: Europe/Rome
      BACKUP_STORAGE_ROOT: /tmp/nsm-ci-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - name: Run isolated suite and capture first failure
        continue-on-error: true
        run: |
          cd app
          : > /tmp/smoke-suite.log
          exit_code=0
          for test in $(find tests -maxdepth 1 -type f -name '*_smoke.py' -printf '%f\n' | sort); do
            echo "===== RESET $test =====" | tee -a /tmp/smoke-suite.log
            alembic downgrade base >> /tmp/smoke-suite.log 2>&1 || true
            if ! alembic upgrade head >> /tmp/smoke-suite.log 2>&1; then
              echo "MIGRATION_FAIL:$test" | tee -a /tmp/smoke-suite.log
              exit_code=2
              break
            fi
            rm -rf /tmp/nsm-ci-backups && mkdir -p /tmp/nsm-ci-backups
            echo "===== RUN $test =====" | tee -a /tmp/smoke-suite.log
            if ! PYTHONPATH=. python "tests/$test" >> /tmp/smoke-suite.log 2>&1; then
              echo "SMOKE_FAIL:$test" | tee -a /tmp/smoke-suite.log
              exit_code=1
              break
            fi
            echo "PASS:$test" | tee -a /tmp/smoke-suite.log
          done
          echo "$exit_code" > /tmp/smoke-suite-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-suite-debug
          path: |
            /tmp/smoke-suite.log
            /tmp/smoke-suite-exit.txt
