name: NSM Core 0.19 Telemetry Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  telemetry:
    if: github.head_ref == 'core-0.19-mikrotik-telemetry'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: network_platform
          POSTGRES_USER: network_platform
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U network_platform -d network_platform"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: network_platform
      DB_NAME: network_platform
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      APP_SECRET_KEY: ci-app-secret-key-not-for-production
      ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
      SESSION_COOKIE_SECURE: 'false'
      APP_TIMEZONE: Europe/Rome
      BACKUP_STORAGE_ROOT: /tmp/nsm-ci-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
      - name: Apply migrations
        run: cd app && alembic upgrade head
      - name: Telemetry stage 1 - parser
        env: {NSM_TELEMETRY_STAGE: memory}
        run: cd app && PYTHONPATH=. python tests/mikrotik_telemetry_smoke.py
      - name: Telemetry stage 2a - enrollment
        env: {NSM_TELEMETRY_STAGE: enroll}
        run: cd app && PYTHONPATH=. python tests/mikrotik_telemetry_smoke.py
      - name: Telemetry stage 2b - heartbeat HTTP
        env: {NSM_TELEMETRY_STAGE: heartbeat-http}
        run: cd app && PYTHONPATH=. python tests/mikrotik_telemetry_smoke.py
      - name: Telemetry stage 2c - heartbeat sampled flag
        env: {NSM_TELEMETRY_STAGE: heartbeat-sampled}
        run: cd app && PYTHONPATH=. python tests/mikrotik_telemetry_smoke.py
      - name: Telemetry stage 2d - three heartbeat responses
        env: {NSM_TELEMETRY_STAGE: heartbeat-response}
        run: cd app && PYTHONPATH=. python tests/mikrotik_telemetry_smoke.py
      - name: Telemetry stage 2e - heartbeat row count
        env: {NSM_TELEMETRY_STAGE: heartbeat-count}
        run: cd app && PYTHONPATH=. python tests/mikrotik_telemetry_smoke.py
      - name: Telemetry stage 2f - heartbeat values
        env: {NSM_TELEMETRY_STAGE: heartbeat}
        run: cd app && PYTHONPATH=. python tests/mikrotik_telemetry_smoke.py
      - name: Telemetry stage 3 - history API
        env: {NSM_TELEMETRY_STAGE: metrics}
        run: cd app && PYTHONPATH=. python tests/mikrotik_telemetry_smoke.py
      - name: Telemetry stage 4 - monitor page
        run: cd app && PYTHONPATH=. python tests/mikrotik_telemetry_smoke.py
