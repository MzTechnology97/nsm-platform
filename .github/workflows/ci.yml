name: NSM Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Compile Python
        run: python -m compileall -q app/app app/alembic

      - name: Parse Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader

          root = Path('app/app/templates')
          env = Environment(loader=FileSystemLoader(str(root)))
          files = sorted(root.glob('*.html'))
          for path in files:
              env.get_template(path.name)
              print(f'OK {path.name}')
          print(f'Parsed {len(files)} templates')
          PY

      - name: Validate shell scripts
        run: |
          bash -n update.sh install_core.sh manage.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Smoke import application
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          APP_SECRET_KEY: ci-app-secret-key-not-for-production
          ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
        run: |
          cd app
          python - <<'PY'
          from app.entrypoint import app
          assert app.version == '0.3.2'
          assert app.state.nsm_templates is not None
          assert str(app.url_path_for('branding_theme_css')) == '/branding/theme.css'
          assert len(app.routes) > 10
          print(f'Core {app.version}: application imported successfully')
          PY

      - name: Prepare dummy runtime env for Compose validation
        run: |
          cp .env.example .env
          mkdir -p secrets
          cat > secrets/bootstrap.env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_PASSWORD=ci-redis-password
          APP_SECRET_KEY=ci-app-secret-key-not-for-production
          ENCRYPTION_MASTER_KEY=ci-encryption-key-not-for-production
          EOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

  promote-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote validated main commit to deploy branch
        run: git push origin "${GITHUB_SHA}:refs/heads/deploy" --force
