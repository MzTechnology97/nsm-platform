name: NSM Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Compile Python
        run: python -m compileall -q app/app app/alembic app/tests

      - name: Parse all Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          root = Path('app/app/templates')
          env = Environment(loader=FileSystemLoader(str(root)))
          templates = sorted(root.glob('*.html'))
          assert templates, 'No templates discovered'
          for path in templates:
              env.get_template(path.name)
          print(f'Parsed {len(templates)} templates')
          PY

      - name: Validate shell scripts
        run: |
          bash -n update.sh install_core.sh manage.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Smoke import application and canonical routes
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          APP_SECRET_KEY: ci-app-secret-key-not-for-production
          ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
          BACKUP_STORAGE_ROOT: /tmp/nsm-ci-backups
        run: |
          cd app
          python - <<'PY'
          from app.entrypoint import app
          zero = '00000000-0000-0000-0000-000000000001'
          assert app.version == '0.36.0'
          expected = {
              'dashboard': '/',
              'devices': '/devices',
              'admin_api_keys': '/admin/api-keys',
              'admin_uisp': '/admin/integrations/uisp',
              'mikrotik_bootstrap': '/api/v1/enrollment/mikrotik/bootstrap',
              'mikrotik_enroll': '/api/v1/agents/mikrotik/enroll',
              'mikrotik_heartbeat': '/api/v1/agents/mikrotik/heartbeat',
              'mikrotik_legacy_job_next': '/api/v1/agents/mikrotik/legacy/jobs/next',
              'firmware': '/operations/firmware',
              'agent_fleet': '/operations/agents',
              'backup_customer_overview': '/operations/backups',
              'search_suggest': '/api/v1/search/suggest',
          }
          for name, path in expected.items():
              assert str(app.url_path_for(name)) == path, (name, app.url_path_for(name))
          assert str(app.url_path_for('queue_mikrotik_firmware_readiness', device_id=zero)) == f'/devices/{zero}/firmware-readiness'
          assert str(app.url_path_for('create_firmware_upgrade_plan', device_id=zero)) == f'/devices/{zero}/firmware-upgrade/plan'
          assert str(app.url_path_for('firmware_upgrade_plan_page', device_id=zero)) == f'/devices/{zero}/firmware-upgrade'
          assert str(app.url_path_for('approve_firmware_upgrade_plan', device_id=zero, plan_id=zero)) == f'/devices/{zero}/firmware-upgrade/{zero}/approve'
          assert str(app.url_path_for('stage_firmware_upgrade_plan', device_id=zero, plan_id=zero)) == f'/devices/{zero}/firmware-upgrade/{zero}/stage'
          assert str(app.url_path_for('mikrotik_firmware_stage_complete', job_id=zero)) == f'/api/v1/agents/mikrotik/firmware-stage/{zero}/complete'
          assert str(app.url_path_for('mikrotik_agent_status', device_id=zero)) == f'/devices/{zero}/agent'
          print(f'Core {app.version}: application and canonical routes OK')
          PY

      - name: Validate Core 0.36 safety contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          staging = Path('app/app/firmware_package_staging.py').read_text()
          planner = Path('app/app/firmware_upgrade_planner.py').read_text()
          plan_page = Path('app/app/templates/firmware_upgrade_plan.html').read_text()
          legacy = Path('app/app/mikrotik_legacy.py').read_text()
          agent_status = Path('app/app/mikrotik_agent_status.py').read_text()
          workspace = Path('app/app/templates/mikrotik_workspace.html').read_text()
          agent_fleet = Path('app/app/agent_fleet.py').read_text()
          fleet_page = Path('app/app/templates/agent_fleet.html').read_text()
          agent_health = Path('app/app/agent_health_automation.py').read_text()
          worker = Path('app/app/worker.py').read_text()
          base = Path('app/app/templates/base.html').read_text()
          for marker in ('firmware_stage','DOWNLOAD {plan.target_version}','download_only','latest-version','/system package update download'):
              assert marker in staging, marker
          assert 'backup_run_id' in staging and 'status != "approved"' in staging
          assert 'DOWNLOAD {{ plan.target_version }}' in plan_page
          assert 'Pacchetti scaricati' in plan_page and 'attivazione/reboot resta intenzionalmente disabilitata' in plan_page
          combined = staging + planner
          for forbidden in ('/system package update install', '/system reboot', ':execute script=', 'command_b64'):
              assert forbidden not in combined, forbidden
          for marker in ('bodyless-v1','http-data=""','X-NSM-Legacy-Transport:headers-v1','X-NSM-Enrollment-Transport','_header_inventory'):
              assert marker in legacy, marker
          bootstrap_body = legacy.split('def _legacy_bootstrap_script', 1)[1].split('def _select_agent_source', 1)[0]
          assert 'nsmJson' not in bootstrap_body
          assert ':serialize' not in bootstrap_body and ':deserialize' not in bootstrap_body
          for marker in ('HEARTBEAT_STALE_AFTER','agent_transport','agent_version','DeviceAgentCredential','DeviceEnrollment'):
              assert marker in agent_status, marker
          for marker in ('href="/devices/{{ device.id }}/agent"','Rigenera / reinstalla agent','Capability effettive','Enrollment recenti'):
              assert marker in workspace, marker
          for marker in ('PER_PAGE = 50','HEARTBEAT_STALE_AFTER','DeviceAgentCredential','DeviceEnrollment','/operations/agents'):
              assert marker in agent_fleet, marker
          for marker in ('Agent Fleet','Heartbeat stale','Credenziale assente','transport=legacy','/agent'):
              assert marker in fleet_page, marker
          for marker in ('TITLE_NO_CREDENTIAL','TITLE_PENDING_ENROLLMENT','TITLE_UNKNOWN_TRANSPORT','AGENT_HEALTH_RECOVERED','recovery_notified_at'):
              assert marker in agent_health, marker
          assert 'agent_health_tick()' in worker
          assert 'href="/operations/agents"' in base
          assert 'secret_hash' not in fleet_page
          assert 'raw_secret' not in fleet_page
          assert 'agent_credential.secret_hash' not in workspace
          assert 'raw_secret' not in workspace
          print('Core 0.36 agent health automation, agent fleet and RouterOS safety contracts OK')
          PY

      - name: Prepare dummy runtime env for Compose validation
        run: |
          cp .env.example .env
          mkdir -p secrets
          cat > secrets/bootstrap.env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_PASSWORD=ci-redis-password
          APP_SECRET_KEY=ci-app-secret-key-not-for-production
          ENCRYPTION_MASTER_KEY=ci-encryption-key-not-for-production
          EOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: network_platform
          POSTGRES_USER: network_platform
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U network_platform -d network_platform"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: network_platform
      DB_NAME: network_platform
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      APP_SECRET_KEY: ci-app-secret-key-not-for-production
      ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
      SESSION_COOKIE_SECURE: 'false'
      APP_TIMEZONE: Europe/Rome
      BACKUP_STORAGE_ROOT: /tmp/nsm-ci-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run complete isolated Core smoke suite
        run: |
          cd app
          count=0
          for test in $(find tests -maxdepth 1 -type f -name '*_smoke.py' -printf '%f\n' | sort); do
            echo "===== reset DB for $test ====="
            alembic downgrade base >/dev/null 2>&1 || true
            alembic upgrade head >/dev/null
            rm -rf /tmp/nsm-ci-backups
            mkdir -p /tmp/nsm-ci-backups
            echo "===== $test ====="
            PYTHONPATH=. python "tests/$test"
            count=$((count + 1))
          done
          test "$count" -ge 20
          echo "Executed $count isolated smoke tests"

  promote-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-checks, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote validated main commit to deploy branch
        run: git push origin "${GITHUB_SHA}:refs/heads/deploy" --force
