name: NSM Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
      - name: Compile Python
        run: python -m compileall -q app/app app/alembic app/tests
      - name: Parse templates and validate scoped UI
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          root = Path('app/app/templates')
          env = Environment(loader=FileSystemLoader(str(root)))
          for path in sorted(root.glob('*.html')):
              env.get_template(path.name)
          base = (root / 'base.html').read_text()
          assert '/branding/theme.css?v={{ app_version }}' in base
          assert 'data-global-search-input' in base
          assert 'data-search-suggestions' in base
          assert 'search_enhancement.css' in base
          assert 'seriale' in base.lower()
          assert 'href="/sites"' not in base
          assert 'customer_workspace.css' in base
          customers = (root / 'customers_workspace.html').read_text()
          assert 'Da aggiornare' in customers and 'CVE gravi' in customers and 'Allarmi' in customers
          assert 'firmware=attention' in customers and 'security=severe' in customers
          assert '/action-center?customer=' in customers
          detail = (root / 'customer_workspace_detail.html').read_text()
          assert 'Apparati con CVE gravi' in detail
          assert '/backups' in detail
          assert '/security#firmware' in detail and '/security#vulnerabilities' in detail
          assert 'Ultime attività' in detail
          tabs = (root / '_customer_tabs.html').read_text()
          for suffix in ('devices', 'sites', 'backups', 'security', 'history'):
              assert f'/{suffix}' in tabs
          customer_devices = (root / 'customer_devices.html').read_text()
          assert 'Seriale' in customer_devices and 'MAC' in customer_devices and 'IP' in customer_devices
          customer_sites = (root / 'customer_sites.html').read_text()
          assert 'Apri apparati' in customer_sites
          customer_security = (root / 'customer_security.html').read_text()
          assert 'Vulnerabilità gravi' in customer_security and 'Lifecycle EOL / EOS' in customer_security
          customer_history = (root / 'customer_history.html').read_text()
          assert 'Audit trail completo' in customer_history and 'actor_map' in customer_history
          devices = (root / 'devices.html').read_text()
          assert 'name="firmware"' in devices and 'name="security"' in devices
          assert 'CVE High / Critical' in devices
          action = (root / 'action_center.html').read_text()
          assert 'name="customer"' in action and 'pagina {{ page }} di {{ pages }}' in action
          vulnerabilities = (root / 'vulnerabilities.html').read_text()
          assert 'name="customer"' in vulnerabilities
          assert 'name="severity"' in vulnerabilities and 'name="status"' in vulnerabilities
          assert 'Vista Security confinata al cliente selezionato' in vulnerabilities
          vulnerability_detail = (root / 'vulnerability_detail.html').read_text()
          assert 'Tutti i clienti interessati' in vulnerability_detail
          assert 'Impatto CVE limitato agli apparati di questo cliente' in vulnerability_detail
          lifecycle = (root / 'lifecycle.html').read_text()
          assert 'name="customer"' in lifecycle and 'name="state"' in lifecycle
          assert 'Vista Lifecycle confinata agli apparati di questo cliente' in lifecycle
          firmware = (root / 'firmware_worklist.html').read_text()
          assert 'name="customer"' in firmware and 'name="state"' in firmware
          assert 'Vista Firmware confinata agli apparati di questo cliente' in firmware
          assert 'Da aggiornare' in firmware and 'Critical' in firmware and 'Sconosciuto' in firmware
          backup_customer = (root / 'customer_backups.html').read_text()
          assert 'Tutte le sedi del cliente' in backup_customer
          assert 'Backup eseguibile' in backup_customer
          assert 'Metodo non pronto' in backup_customer
          assert 'policy effettiva + metodo di backup realmente eseguibile' in backup_customer
          assert '_customer_tabs.html' in backup_customer
          global_backup = (root / 'backup_customer_overview.html').read_text()
          assert 'Controllo globale di copertura e policy' in global_backup
          assert 'Dettaglio per cliente' in global_backup
          assert 'Stato backup per cliente' not in global_backup
          assert 'backup realmente eseguibile' in global_backup
          form = (root / 'backup_policy_form.html').read_text()
          assert 'name="schedule_cron"' not in form
          assert 'data-customer-select' in form
          assert 'data-site-select' in form and 'data-device-select' in form
          assert 'Metodo automatico per apparato' in form
          assert 'MikroTik · Agent NSM' in form
          device = (root / 'device_detail.html').read_text()
          assert '/backup-now' in device and 'Backup ora' in device
          search_page = (root / 'search.html').read_text()
          assert 'Seriale {{ d.serial_number }}' in search_page
          assert 'MAC {{ d.primary_mac }}' in search_page
          assert 'IP {{ d.management_ip }}' in search_page
          agent = Path('app/app/mikrotik_backup_agent.py').read_text()
          assert '/system backup save' in agent
          assert 'encryption=aes-sha256' in agent
          assert '/file read' in agent
          assert 'to=base64' in agent
          assert '/api/v1/agents/mikrotik/backup-jobs/' in agent
          assert 'ftp' not in agent.lower()
          capabilities = Path('app/app/backup_capabilities.py').read_text()
          assert 'connector_required' in capabilities
          assert 'acs_required' in capabilities
          assert 'agent_required' in capabilities
          drilldown = Path('app/app/customer_drilldown.py').read_text()
          assert '_severe_cve_exists' in drilldown
          assert 'firmware == "attention"' in drilldown
          security = Path('app/app/security_drilldown.py').read_text()
          assert 'affected_devices' in security and 'affected_customers' in security
          assert '_impact_state_filter' in security
          lifecycle_drilldown = Path('app/app/lifecycle_drilldown.py').read_text()
          assert 'LIFECYCLE_ATTENTION_STATES' in lifecycle_drilldown
          firmware_worklist = Path('app/app/firmware_worklist.py').read_text()
          assert 'SECURITY_STATES' in firmware_worklist and 'CRITICAL_STATES' in firmware_worklist
          assert '_firmware_attention_condition' in firmware_worklist
          customer_tabs = Path('app/app/customer_tabs.py').read_text()
          assert 'install_customer_tabs' in customer_tabs and '_backup_summary' in customer_tabs
          search = Path('app/app/search_enhancement.py').read_text()
          assert 'match_field' in search and 'completion' in search
          ui = Path('app/app/static/ui.js').read_text()
          assert "event.key === 'Tab'" in ui
          assert 'search-meta-chip' in ui and 'match_field' in ui
          print('Core 0.15 customer tabs, backup control plane and enhanced search validated')
          PY
      - name: Validate shell scripts
        run: |
          bash -n update.sh install_core.sh manage.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Smoke import application
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          APP_SECRET_KEY: ci-app-secret-key-not-for-production
          ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
          BACKUP_STORAGE_ROOT: /tmp/nsm-ci-backups
        run: |
          cd app
          python - <<'PY'
          from app.entrypoint import app
          zero='00000000-0000-0000-0000-000000000001'
          assert app.version == '0.15.0'
          assert str(app.url_path_for('mikrotik_bootstrap')) == '/api/v1/enrollment/mikrotik/bootstrap'
          assert str(app.url_path_for('mikrotik_enroll')) == '/api/v1/agents/mikrotik/enroll'
          assert str(app.url_path_for('mikrotik_heartbeat')) == '/api/v1/agents/mikrotik/heartbeat'
          assert str(app.url_path_for('queue_mikrotik_backup', device_id=zero)) == f'/devices/{zero}/backup-now'
          assert str(app.url_path_for('mikrotik_backup_config', job_id=zero)).endswith('/backup-config')
          assert str(app.url_path_for('mikrotik_artifact_chunk', upload_id=zero)).endswith('/chunk')
          assert str(app.url_path_for('backup_aware_job_complete', job_id=zero)) == f'/api/v1/agents/mikrotik/backup-jobs/{zero}/complete'
          assert str(app.url_path_for('customer_workspace_list')) == '/customers'
          assert str(app.url_path_for('customer_workspace_detail', customer_id=zero)) == f'/customers/{zero}'
          assert str(app.url_path_for('customer_devices', customer_id=zero)) == f'/customers/{zero}/devices'
          assert str(app.url_path_for('customer_sites', customer_id=zero)) == f'/customers/{zero}/sites'
          assert str(app.url_path_for('customer_backups', customer_id=zero)) == f'/customers/{zero}/backups'
          assert str(app.url_path_for('customer_security', customer_id=zero)) == f'/customers/{zero}/security'
          assert str(app.url_path_for('customer_history', customer_id=zero)) == f'/customers/{zero}/history'
          assert str(app.url_path_for('backup_customer_overview')) == '/operations/backups'
          assert str(app.url_path_for('search_suggest')) == '/api/v1/search/suggest'
          assert str(app.url_path_for('devices')) == '/devices'
          assert str(app.url_path_for('action_center')) == '/action-center'
          assert str(app.url_path_for('vulnerabilities')) == '/security/vulnerabilities'
          assert str(app.url_path_for('vulnerability_detail', advisory_id=zero)) == f'/security/vulnerabilities/{zero}'
          assert str(app.url_path_for('lifecycle')) == '/security/lifecycle'
          assert str(app.url_path_for('firmware')) == '/operations/firmware'
          print(f'Core {app.version}: application imported successfully')
          PY
      - name: Prepare dummy runtime env for Compose validation
        run: |
          cp .env.example .env
          mkdir -p secrets
          cat > secrets/bootstrap.env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_PASSWORD=ci-redis-password
          APP_SECRET_KEY=ci-app-secret-key-not-for-production
          ENCRYPTION_MASTER_KEY=ci-encryption-key-not-for-production
          EOF
      - name: Validate Docker Compose
        run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: network_platform
          POSTGRES_USER: network_platform
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U network_platform -d network_platform"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: network_platform
      DB_NAME: network_platform
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      APP_SECRET_KEY: ci-app-secret-key-not-for-production
      ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
      SESSION_COOKIE_SECURE: 'false'
      APP_TIMEZONE: Europe/Rome
      BACKUP_STORAGE_ROOT: /tmp/nsm-ci-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
      - name: Apply migrations
        run: cd app && alembic upgrade head
      - name: Run audited CRUD smoke test
        run: cd app && PYTHONPATH=. python tests/crud_smoke.py
      - name: Run Core 0.6 Backup Center smoke test
        run: cd app && PYTHONPATH=. python tests/core06_smoke.py
      - name: Run Core 0.7 MikroTik agent smoke test
        run: cd app && PYTHONPATH=. python tests/mikrotik_agent_smoke.py
      - name: Run Core 0.8 chunked MikroTik backup smoke test
        run: cd app && PYTHONPATH=. python tests/mikrotik_backup_smoke.py
      - name: Run Core 0.9 backup maintenance smoke test
        run: cd app && PYTHONPATH=. python tests/backup_maintenance_smoke.py
      - name: Run Core 0.9 customer workspace smoke test
        run: cd app && PYTHONPATH=. python tests/customer_workspace_smoke.py
      - name: Run Core 0.10 backup capability registry smoke test
        run: cd app && PYTHONPATH=. python tests/backup_capabilities_smoke.py
      - name: Run Core 0.11 customer drilldown smoke test
        run: cd app && PYTHONPATH=. python tests/customer_drilldown_smoke.py
      - name: Run Core 0.12 security drilldown smoke test
        run: cd app && PYTHONPATH=. python tests/security_drilldown_smoke.py
      - name: Run Core 0.13 lifecycle drilldown smoke test
        run: cd app && PYTHONPATH=. python tests/lifecycle_drilldown_smoke.py
      - name: Run Core 0.14 firmware worklist smoke test
        run: cd app && PYTHONPATH=. python tests/firmware_worklist_smoke.py
      - name: Run Core 0.15 customer tabs and enhanced search smoke test
        run: cd app && PYTHONPATH=. python tests/customer_tabs_search_smoke.py

  promote-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-checks, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote validated main commit to deploy branch
        run: git push origin "${GITHUB_SHA}:refs/heads/deploy" --force
