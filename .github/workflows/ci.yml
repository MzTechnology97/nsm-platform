name: NSM Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Compile Python
        run: python -m compileall -q app/app app/alembic app/tests

      - name: Parse all Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          root = Path('app/app/templates')
          env = Environment(loader=FileSystemLoader(str(root)))
          templates = sorted(root.glob('*.html'))
          assert templates, 'No templates discovered'
          for path in templates:
              env.get_template(path.name)
          print(f'Parsed {len(templates)} templates')
          PY

      - name: Validate shell scripts
        run: |
          bash -n update.sh install_core.sh manage.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Smoke import application and canonical routes
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          APP_SECRET_KEY: ci-app-secret-key-not-for-production
          ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
          BACKUP_STORAGE_ROOT: /tmp/nsm-ci-backups
        run: |
          cd app
          python - <<'PY'
          from app.entrypoint import app
          zero = '00000000-0000-0000-0000-000000000001'
          assert app.version == '0.40.0'
          expected = {
              'dashboard': '/',
              'devices': '/devices',
              'admin_api_keys': '/admin/api-keys',
              'admin_uisp': '/admin/integrations/uisp',
              'mikrotik_bootstrap': '/api/v1/enrollment/mikrotik/bootstrap',
              'mikrotik_enroll': '/api/v1/agents/mikrotik/enroll',
              'mikrotik_heartbeat': '/api/v1/agents/mikrotik/heartbeat',
              'mikrotik_legacy_job_next': '/api/v1/agents/mikrotik/legacy/jobs/next',
              'firmware': '/operations/firmware',
              'agent_fleet': '/operations/agents',
              'backup_customer_overview': '/operations/backups',
              'search_suggest': '/api/v1/search/suggest',
              'audit_events_worklist': '/audit/events',
              'audit_events_export_csv': '/audit/events/export.csv',
          }
          for name, path in expected.items():
              assert str(app.url_path_for(name)) == path, (name, app.url_path_for(name))
          assert str(app.url_path_for('device_activity_worklist', device_id=zero)) == f'/devices/{zero}/jobs'
          assert str(app.url_path_for('queue_mikrotik_firmware_readiness', device_id=zero)) == f'/devices/{zero}/firmware-readiness'
          assert str(app.url_path_for('create_firmware_upgrade_plan', device_id=zero)) == f'/devices/{zero}/firmware-upgrade/plan'
          assert str(app.url_path_for('activate_firmware_upgrade_plan', device_id=zero, plan_id=zero)) == f'/devices/{zero}/firmware-upgrade/{zero}/activate'
          assert str(app.url_path_for('routerboot_lifecycle_page', device_id=zero)) == f'/devices/{zero}/routerboot'
          assert str(app.url_path_for('mikrotik_agent_status', device_id=zero)) == f'/devices/{zero}/agent'
          print(f'Core {app.version}: application and canonical routes OK')
          PY

      - name: Validate security and Core 0.40 contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          staging = Path('app/app/firmware_package_staging.py').read_text()
          activation = Path('app/app/firmware_activation.py').read_text()
          routerboot = Path('app/app/routerboot_lifecycle.py').read_text()
          privilege = Path('app/app/mikrotik_privilege_profile.py').read_text()
          legacy = Path('app/app/mikrotik_legacy.py').read_text()
          activity = Path('app/app/activity_worklists.py').read_text()
          device_activity = Path('app/app/templates/device_activity.html').read_text()
          audit_page = Path('app/app/templates/audit_events_v2.html').read_text()
          modern_syntax = Path('app/app/mikrotik_modern_syntax.py').read_text()
          modern_syntax_test = Path('app/tests/mikrotik_modern_syntax_smoke.py').read_text()

          # Package staging must remain download-only.
          assert '/system package update download' in staging
          assert '/system package update install' not in staging
          assert '/system reboot' not in staging

          # Activation is the only RouterOS package path allowed to reboot, and
          # acknowledgement must be present before reboot execution.
          assert 'firmware_activate' in activation
          assert '/system reboot' in activation
          assert activation.index('/firmware-activate/') < activation.index('/system reboot')
          assert '/system routerboard upgrade' not in activation

          # RouterBOOT remains an explicitly separate lifecycle.
          assert '/system routerboard upgrade' in routerboot
          assert '/system reboot' in routerboot
          assert 'auto-upgrade=yes' not in routerboot

          # Privilege profiles stay fixed/fail-closed.
          assert 'MODERN_PROFILE = "ops-v1"' in privilege
          assert 'LEGACY_PROFILE = "legacy-read-v1"' in privilege
          assert 'MODERN_POLICIES = "ftp,reboot,read,write,test"' in privilege
          assert 'LEGACY_POLICIES = "read,test"' in privilege

          # RouterOS 7.12 bootstrap remains bodyless and avoids unsupported JSON helpers.
          bootstrap = legacy.split('def _legacy_bootstrap_script', 1)[1].split('def _select_agent_source', 1)[0]
          assert 'http-data=""' in bootstrap
          assert 'nsmJson' not in bootstrap
          assert ':serialize' not in bootstrap and ':deserialize' not in bootstrap

          # Core 0.40 hardens the complete modern source generated for RouterOS.
          for marker in ('normalize_modern_agent_source', 'validate_modern_agent_source', '_EMPTY_LOCAL_RE'):
              assert marker in modern_syntax, marker
          assert 'invalid RouterOS empty local initializer survived' in modern_syntax_test
          assert 'firmware_activate' in modern_syntax_test
          assert 'routerboot_upgrade' in modern_syntax_test

          # Core 0.39 worklists remain paginated/filterable and export respects filters.
          for marker in ('PAGE_SIZES', 'ACTIVE_JOB_STATES', 'audit_events_export_csv', 'AUDIT_EVENTS_EXPORTED', 'limit(50000)'):
              assert marker in activity, marker
          for marker in ('Coda attiva', 'Storico operativo', 'per_page', 'from_date', 'to_date'):
              assert marker in device_activity, marker
          for marker in ('Esporta CSV', 'Registro eventi', 'customer', 'device', 'per_page'):
              assert marker in audit_page, marker

          print('Core 0.40 safety, syntax and scalability contracts OK')
          PY

      - name: Prepare dummy runtime env for Compose validation
        run: |
          cp .env.example .env
          mkdir -p secrets
          cat > secrets/bootstrap.env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_PASSWORD=ci-redis-password
          APP_SECRET_KEY=ci-app-secret-key-not-for-production
          ENCRYPTION_MASTER_KEY=ci-encryption-key-not-for-production
          EOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: network_platform
          POSTGRES_USER: network_platform
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U network_platform -d network_platform"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: network_platform
      DB_NAME: network_platform
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      APP_SECRET_KEY: ci-app-secret-key-not-for-production
      ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
      SESSION_COOKIE_SECURE: 'false'
      APP_TIMEZONE: Europe/Rome
      BACKUP_STORAGE_ROOT: /tmp/nsm-ci-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run complete isolated Core smoke suite
        run: |
          cd app
          count=0
          for test in $(find tests -maxdepth 1 -type f -name '*_smoke.py' -printf '%f\n' | sort); do
            echo "===== reset DB for $test ====="
            alembic downgrade base >/dev/null 2>&1 || true
            alembic upgrade head >/dev/null
            rm -rf /tmp/nsm-ci-backups
            mkdir -p /tmp/nsm-ci-backups
            echo "===== $test ====="
            PYTHONPATH=. python "tests/$test"
            count=$((count + 1))
          done
          test "$count" -ge 20
          echo "Executed $count isolated smoke tests"

  promote-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-checks, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote validated main commit to deploy branch
        run: git push origin "${GITHUB_SHA}:refs/heads/deploy" --force
