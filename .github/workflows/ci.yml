name: NSM Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
      - name: Compile Python
        run: python -m compileall -q app/app app/alembic app/tests
      - name: Parse all Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          root = Path('app/app/templates')
          env = Environment(loader=FileSystemLoader(str(root)))
          templates = sorted(root.glob('*.html'))
          assert templates, 'No templates discovered'
          for path in templates:
              env.get_template(path.name)
          print(f'Parsed {len(templates)} templates')
          PY
      - name: Validate shell scripts
        run: |
          bash -n update.sh install_core.sh manage.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Smoke import application and canonical routes
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          APP_SECRET_KEY: ci-app-secret-key-not-for-production
          ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
          BACKUP_STORAGE_ROOT: /tmp/nsm-ci-backups
        run: |
          cd app
          python - <<'PY'
          from app.entrypoint import app
          zero = '00000000-0000-0000-0000-000000000001'
          import re
          # Core 0.49 series: the patch number increases with every release (docs/CHANGELOG.md).
          assert re.fullmatch(r'0\.49\.\d+', app.version), app.version
          expected = {
              'dashboard': '/', 'devices': '/devices', 'admin_api_keys': '/admin/api-keys',
              'admin_uisp': '/admin/integrations/uisp', 'mikrotik_bootstrap': '/api/v1/enrollment/mikrotik/bootstrap',
              'mikrotik_enroll': '/api/v1/agents/mikrotik/enroll', 'mikrotik_heartbeat': '/api/v1/agents/mikrotik/heartbeat',
              'mikrotik_legacy_job_next': '/api/v1/agents/mikrotik/legacy/jobs/next', 'firmware': '/operations/firmware',
              'agent_fleet': '/operations/agents', 'backup_customer_overview': '/operations/backups',
              'search_suggest': '/api/v1/search/suggest', 'audit_events_worklist': '/audit/events',
              'audit_events_export_csv': '/audit/events/export.csv',
          }
          for name, path in expected.items():
              assert str(app.url_path_for(name)) == path, (name, app.url_path_for(name))
          assert str(app.url_path_for('device_activity_worklist', device_id=zero)) == f'/devices/{zero}/jobs'
          assert str(app.url_path_for('queue_mikrotik_firmware_readiness', device_id=zero)) == f'/devices/{zero}/firmware-readiness'
          assert str(app.url_path_for('create_firmware_upgrade_plan', device_id=zero)) == f'/devices/{zero}/firmware-upgrade/plan'
          assert str(app.url_path_for('activate_firmware_upgrade_plan', device_id=zero, plan_id=zero)) == f'/devices/{zero}/firmware-upgrade/{zero}/activate'
          assert str(app.url_path_for('routerboot_lifecycle_page', device_id=zero)) == f'/devices/{zero}/routerboot'
          assert str(app.url_path_for('mikrotik_agent_status', device_id=zero)) == f'/devices/{zero}/agent'
          assert str(app.url_path_for('queue_mikrotik_agent_update', device_id=zero)) == f'/devices/{zero}/agent/update'
          assert str(app.url_path_for('mikrotik_agent_update_source', job_id=zero)) == f'/api/v1/agents/mikrotik/self-update/{zero}/source'
          assert str(app.url_path_for('mikrotik_interfaces', device_id=zero)) == f'/devices/{zero}/interfaces'
          assert str(app.url_path_for('mikrotik_ip_addresses', device_id=zero)) == f'/devices/{zero}/ip-addresses'
          assert str(app.url_path_for('mikrotik_routes', device_id=zero)) == f'/devices/{zero}/routes'
          assert str(app.url_path_for('mikrotik_firewall', device_id=zero)) == f'/devices/{zero}/firewall'
          assert str(app.url_path_for('mikrotik_dhcp_leases', device_id=zero)) == f'/devices/{zero}/dhcp-leases'
          assert str(app.url_path_for('mikrotik_configuration_v2', device_id=zero)) == f'/devices/{zero}/configuration'
          assert str(app.url_path_for('mikrotik_config_history', device_id=zero)) == f'/devices/{zero}/configuration/history'
          assert str(app.url_path_for('mikrotik_diagnostics_v2', device_id=zero)) == f'/devices/{zero}/diagnostics'
          assert str(app.url_path_for('mikrotik_diagnostic_result', device_id=zero, job_id=zero)) == f'/devices/{zero}/diagnostics/jobs/{zero}'
          print(f'Core {app.version}: application and canonical routes OK')
          PY
      - name: Validate security and Core 0.49 contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          staging = Path('app/app/firmware_package_staging.py').read_text()
          activation = Path('app/app/firmware_activation.py').read_text()
          routerboot = Path('app/app/routerboot_lifecycle.py').read_text()
          privilege = Path('app/app/mikrotik_privilege_profile.py').read_text()
          legacy = Path('app/app/mikrotik_legacy.py').read_text()
          compatibility = Path('app/app/mikrotik_compatibility.py').read_text()
          updater = Path('app/app/mikrotik_agent_update.py').read_text()
          activity = Path('app/app/activity_worklists.py').read_text()
          device_activity = Path('app/app/templates/device_activity.html').read_text()
          audit_page = Path('app/app/templates/audit_events_v2.html').read_text()
          modern_syntax = Path('app/app/mikrotik_modern_syntax.py').read_text()
          modern_syntax_test = Path('app/tests/mikrotik_modern_syntax_smoke.py').read_text()
          agent_install = Path('app/app/templates/mikrotik_agent_status.html').read_text()
          agent_fleet = Path('app/app/agent_fleet.py').read_text()
          agent_fleet_page = Path('app/app/templates/agent_fleet.html').read_text()
          agent_health = Path('app/app/agent_health_automation.py').read_text()
          workspace_ux = Path('app/app/mikrotik_workspace_ux.py').read_text()
          monitor = Path('app/app/templates/mikrotik_monitor.html').read_text()
          diagnostics = Path('app/app/templates/mikrotik_diagnostics_v2.html').read_text()
          ui_js = Path('app/app/static/ui.js').read_text()
          drift = Path('app/app/config_drift.py').read_text()
          drift_page = Path('app/app/templates/mikrotik_config_history.html').read_text()
          configuration = Path('app/app/mikrotik_configuration_unified.py').read_text()
          configuration_page = Path('app/app/templates/mikrotik_configuration_unified.html').read_text()

          assert '/system package update download' in staging and '/system package update install' not in staging and '/system reboot' not in staging
          assert 'firmware_activate' in activation and '/system reboot' in activation and activation.index('/firmware-activate/') < activation.index('/system reboot')
          assert '/system routerboard upgrade' not in activation and '/system routerboard upgrade' in routerboot and '/system reboot' in routerboot and 'auto-upgrade=yes' not in routerboot
          assert 'MODERN_PROFILE = "ops-v2"' in privilege and 'BACKUP_PROFILES = frozenset({"ops-v2"})' in privilege and 'LEGACY_PROFILE = "legacy-ops-v1"' in privilege
          assert 'MODERN_POLICIES = "ftp,reboot,read,write,policy,test,sensitive"' in privilege and 'LEGACY_POLICIES = "ftp,reboot,read,write,test"' in privilege
          bootstrap = legacy.split('def _legacy_bootstrap_script', 1)[1].split('def _select_agent_source', 1)[0]
          assert 'http-data=""' in bootstrap and 'nsmJson' not in bootstrap and ':serialize' not in bootstrap and ':deserialize' not in bootstrap
          for marker in ('resolve_routeros_compatibility', 'compatibility_profile', 'migration_required', 'routeros-7.12-legacy', 'routeros-7.13-plus', 'unvalidated'):
              assert marker in compatibility, marker
          assert 'parsed[0] != 7' in compatibility
          for marker in ('TARGET_AGENT_VERSION', 'source-v1', 'previous-known-good', 'agent_expected_source_sha512', 'agent_source_drift', 'rolled_back', 'transform=sha512'):
              assert marker in updater, marker
          assert 'arbitrary' in updater and 'legacy' in updater and 'reinstall-only' in updater
          for marker in ('normalize_modern_agent_source', 'validate_modern_agent_source', '_EMPTY_LOCAL_RE'):
              assert marker in modern_syntax, marker
          assert 'invalid RouterOS empty local initializer survived' in modern_syntax_test
          for marker in ('Verifica installazione', 'Pairing one-shot', 'Heartbeat post-installazione', 'parser RouterOS'):
              assert marker in agent_install, marker
          for marker in ('_installation_state', 'install_suspect', 'token_expired', 'install_filter', 'ENROLLMENT_HISTORY_WINDOW'):
              assert marker in agent_fleet, marker
          for marker in ('Installazione KO', 'Pairing OK / agent non avviato', 'install=suspect', 'Token scaduti'):
              assert marker in agent_fleet_page, marker
          for marker in ('TITLE_INSTALL_SUSPECT', 'TITLE_TOKEN_EXPIRED', '_installation_state', 'AGENT_HEALTH_RECOVERED'):
              assert marker in agent_health, marker
          for marker in ('human_bytes', 'snapshot_supported', 'telemetry_history_supported', 'Support snapshot non disponibile', '409'):
              assert marker in workspace_ux, marker
          for marker in ('Storico non supportato', 'memory_used_percent', 'device_layout.html'):
              assert marker in monitor, marker
          device_layout = Path('app/app/templates/device_layout.html').read_text()
          for marker in ('MAC', 'IP gestione', 'device-tabs', "('backups', 'Backup'", "('firmware', 'Firmware'"):
              assert marker in device_layout, marker
          for marker in ('Risultati recenti', 'NON DISP.', '/diagnostics/jobs/'):
              assert marker in diagnostics, marker
          for marker in ('copyEnrollmentCommand', 'textContent', 'Copiato', 'Copia non riuscita'):
              assert marker in ui_js, marker
          for marker in ('CONFIG_DRIFT_DETECTED', 'CONFIG_BASELINE_APPROVED', 'config_baseline_artifact_id', '_normalized_export', '_install_backup_completion_hook'):
              assert marker in drift, marker
          for marker in ('Cronologia configurazione', 'Imposta baseline', 'DA VERIFICARE', 'BASELINE'):
              assert marker in drift_page, marker
          # Structured RouterOS sections are rendered only by the unified
          # configuration workspace; legacy section URLs redirect to it.
          for marker in ('_normalize_interface', '_normalize_ip', '_normalize_route', '_normalize_firewall', '_normalize_lease',
                         'actual-mtu', 'rx-byte', 'routing-table', 'actual-interface', 'src-address-list', 'active-mac-address',
                         'def redirect_interfaces', 'def redirect_dhcp_leases'):
              assert marker in configuration, marker
          for marker in ('section=interfaces', 'section=ip_addresses', 'section=routes', 'section=firewall', 'Filter + NAT',
                         'Default route', 'Check gateway', 'Disabled', 'Dinamici'):
              assert marker in configuration_page, marker
          for marker in ('PAGE_SIZES', 'ACTIVE_JOB_STATES', 'audit_events_export_csv', 'AUDIT_EVENTS_EXPORTED', 'limit(50000)'):
              assert marker in activity, marker
          for marker in ('Coda attiva', 'Storico operativo', 'per_page', 'from_date', 'to_date'):
              assert marker in device_activity, marker
          for marker in ('Esporta CSV', 'Registro eventi', 'customer', 'device', 'per_page'):
              assert marker in audit_page, marker
          print('Core 0.49 safety, compatibility and agent self-update contracts OK')
          PY
      - name: Prepare dummy runtime env for Compose validation
        run: |
          cp .env.example .env
          mkdir -p secrets
          cat > secrets/bootstrap.env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_PASSWORD=ci-redis-password
          APP_SECRET_KEY=ci-app-secret-key-not-for-production
          ENCRYPTION_MASTER_KEY=ci-encryption-key-not-for-production
          EOF
      - name: Validate Docker Compose
        run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: network_platform
          POSTGRES_USER: network_platform
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U network_platform -d network_platform"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: network_platform
      DB_NAME: network_platform
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      APP_SECRET_KEY: ci-app-secret-key-not-for-production
      ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
      SESSION_COOKIE_SECURE: 'false'
      APP_TIMEZONE: Europe/Rome
      BACKUP_STORAGE_ROOT: /tmp/nsm-ci-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
      - name: Run complete isolated Core smoke suite
        run: |
          cd app
          count=0
          for test in $(find tests -maxdepth 1 -type f -name '*_smoke.py' -printf '%f\n' | sort); do
            echo "===== reset DB for $test ====="
            alembic downgrade base >/dev/null 2>&1 || true
            alembic upgrade head >/dev/null
            rm -rf /tmp/nsm-ci-backups
            mkdir -p /tmp/nsm-ci-backups
            echo "===== $test ====="
            PYTHONPATH=. python "tests/$test"
            count=$((count + 1))
          done
          test "$count" -ge 20
          echo "Executed $count isolated smoke tests"

  promote-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-checks, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote validated main commit to deploy branch
        run: git push origin "${GITHUB_SHA}:refs/heads/deploy" --force
