name: NSM Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Compile Python
        run: python -m compileall -q app/app app/alembic app/tests

      - name: Parse all Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          root = Path('app/app/templates')
          env = Environment(loader=FileSystemLoader(str(root)))
          templates = sorted(root.glob('*.html'))
          assert templates, 'No templates discovered'
          for path in templates:
              env.get_template(path.name)
          print(f'Parsed {len(templates)} templates')
          PY

      - name: Validate shell scripts
        run: |
          bash -n update.sh install_core.sh manage.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Smoke import application and canonical routes
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          APP_SECRET_KEY: ci-app-secret-key-not-for-production
          ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
          BACKUP_STORAGE_ROOT: /tmp/nsm-ci-backups
        run: |
          cd app
          python - <<'PY'
          from app.entrypoint import app
          zero = '00000000-0000-0000-0000-000000000001'
          assert app.version == '0.30.0'
          expected = {
              'dashboard': '/',
              'devices': '/devices',
              'admin_api_keys': '/admin/api-keys',
              'admin_uisp': '/admin/integrations/uisp',
              'mikrotik_bootstrap': '/api/v1/enrollment/mikrotik/bootstrap',
              'mikrotik_enroll': '/api/v1/agents/mikrotik/enroll',
              'mikrotik_heartbeat': '/api/v1/agents/mikrotik/heartbeat',
              'mikrotik_legacy_job_next': '/api/v1/agents/mikrotik/legacy/jobs/next',
              'firmware': '/operations/firmware',
              'backup_customer_overview': '/operations/backups',
              'search_suggest': '/api/v1/search/suggest',
          }
          for name, path in expected.items():
              assert str(app.url_path_for(name)) == path, (name, app.url_path_for(name))
          assert str(app.url_path_for('mikrotik_legacy_job_complete', job_id=zero)) == f'/api/v1/agents/mikrotik/legacy/jobs/{zero}/complete'
          assert str(app.url_path_for('queue_mikrotik_firmware_readiness', device_id=zero)) == f'/devices/{zero}/firmware-readiness'
          assert str(app.url_path_for('mikrotik_firmware_readiness_complete', job_id=zero)) == f'/api/v1/agents/mikrotik/firmware-readiness/{zero}/complete'
          assert str(app.url_path_for('mikrotik_workspace_overview', device_id=zero)) == f'/devices/{zero}'
          assert str(app.url_path_for('customer_workspace_detail', customer_id=zero)) == f'/customers/{zero}'
          print(f'Core {app.version}: application and canonical routes OK')
          PY

      - name: Validate Core 0.30 safety contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          legacy = Path('app/app/mikrotik_legacy.py').read_text()
          readiness = Path('app/app/mikrotik_firmware_readiness.py').read_text()
          legacy_jobs = Path('app/app/mikrotik_legacy_jobs.py').read_text()
          firmware_page = Path('app/app/templates/firmware_worklist.html').read_text()
          for marker in ('MODERN_AGENT_MIN = (7, 13)', '_supports_modern_agent', 'X-NSM-Agent-Transport'):
              assert marker in legacy, marker
          for marker in ('firmware_readiness', 'check-for-updates once', 'latest-version', 'upgrade-firmware'):
              assert marker in readiness, marker
          assert 'firmware_readiness' in legacy_jobs
          assert 'Verifica ora' in firmware_page and 'non scarica pacchetti' in firmware_page
          combined = readiness + legacy_jobs
          for forbidden in ('/system package update install', '/system reboot', ':execute script=', 'command_b64'):
              assert forbidden not in combined, forbidden
          print('Core 0.30 safety contracts OK')
          PY

      - name: Prepare dummy runtime env for Compose validation
        run: |
          cp .env.example .env
          mkdir -p secrets
          cat > secrets/bootstrap.env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_PASSWORD=ci-redis-password
          APP_SECRET_KEY=ci-app-secret-key-not-for-production
          ENCRYPTION_MASTER_KEY=ci-encryption-key-not-for-production
          EOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: network_platform
          POSTGRES_USER: network_platform
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U network_platform -d network_platform"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: network_platform
      DB_NAME: network_platform
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      APP_SECRET_KEY: ci-app-secret-key-not-for-production
      ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
      SESSION_COOKIE_SECURE: 'false'
      APP_TIMEZONE: Europe/Rome
      BACKUP_STORAGE_ROOT: /tmp/nsm-ci-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run complete isolated Core smoke suite
        run: |
          cd app
          count=0
          for test in $(find tests -maxdepth 1 -type f -name '*_smoke.py' -printf '%f\n' | sort); do
            echo "===== reset DB for $test ====="
            alembic downgrade base >/dev/null 2>&1 || true
            alembic upgrade head >/dev/null
            rm -rf /tmp/nsm-ci-backups
            mkdir -p /tmp/nsm-ci-backups
            echo "===== $test ====="
            PYTHONPATH=. python "tests/$test"
            count=$((count + 1))
          done
          test "$count" -ge 20
          echo "Executed $count isolated smoke tests"

  promote-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-checks, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote validated main commit to deploy branch
        run: git push origin "${GITHUB_SHA}:refs/heads/deploy" --force
