name: NSM Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Compile Python
        run: python -m compileall -q app/app app/alembic app/tests

      - name: Parse Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader

          root = Path('app/app/templates')
          env = Environment(loader=FileSystemLoader(str(root)))
          files = sorted(root.glob('*.html'))
          for path in files:
              env.get_template(path.name)
              print(f'OK {path.name}')
          base = (root / 'base.html').read_text()
          assert '/branding/theme.css?v={{ app_version }}' in base
          assert "styles.css') }}?v={{ app_version }}" in base
          assert "theme.css') }}?v={{ app_version }}" in base
          assert "workflow.css') }}?v={{ app_version }}" in base
          assert "ui.js') }}?v={{ app_version }}" in base
          assert 'data-global-search-input' in base
          assert 'data-search-suggestions' in base
          print(f'Parsed {len(files)} templates')
          PY

      - name: Validate shell scripts
        run: |
          bash -n update.sh install_core.sh manage.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Smoke import application
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          APP_SECRET_KEY: ci-app-secret-key-not-for-production
          ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
        run: |
          cd app
          python - <<'PY'
          from app.entrypoint import app
          assert app.version == '0.5.0'
          assert app.state.nsm_templates is not None
          assert str(app.url_path_for('branding_theme_css')) == '/branding/theme.css'
          assert str(app.url_path_for('search_suggest')) == '/api/v1/search/suggest'
          assert str(app.url_path_for('customer_new')) == '/customers/new/form'
          assert str(app.url_path_for('backup_policy_new')) == '/operations/backups/policies/new'
          assert str(app.url_path_for('device_manage_page', device_id='00000000-0000-0000-0000-000000000001')) == '/devices/00000000-0000-0000-0000-000000000001/manage'
          assert len(app.routes) > 20
          print(f'Core {app.version}: application imported successfully')
          PY

      - name: Prepare dummy runtime env for Compose validation
        run: |
          cp .env.example .env
          mkdir -p secrets
          cat > secrets/bootstrap.env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_PASSWORD=ci-redis-password
          APP_SECRET_KEY=ci-app-secret-key-not-for-production
          ENCRYPTION_MASTER_KEY=ci-encryption-key-not-for-production
          EOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

  crud-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: network_platform
          POSTGRES_USER: network_platform
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U network_platform -d network_platform"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: network_platform
      DB_NAME: network_platform
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      APP_SECRET_KEY: ci-app-secret-key-not-for-production
      ENCRYPTION_MASTER_KEY: ci-encryption-key-not-for-production
      SESSION_COOKIE_SECURE: "false"
      APP_TIMEZONE: Europe/Rome
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Apply migrations
        run: |
          cd app
          alembic upgrade head

      - name: Run audited CRUD smoke test
        run: |
          cd app
          PYTHONPATH=. python tests/crud_smoke.py

  promote-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-checks, crud-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote validated main commit to deploy branch
        run: git push origin "${GITHUB_SHA}:refs/heads/deploy" --force
