{% set ui = ui_context(request) %}
<!doctype html>
<html lang="it" data-theme="{{ ui.theme or 'light' }}" data-server-theme="{{ ui.theme or '' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="{{ ui.branding.sidebar_color }}">
  <title>{% block title %}{{ ui.branding.portal_name }}{% endblock %}</title>
  <script src="{{ url_for('static', path='/theme-init.js') }}?v={{ asset_version }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v={{ asset_version }}">
  <link rel="stylesheet" href="/branding/theme.css?v={{ app_version }}" data-runtime-branding>
</head>
<body>
<main class="login-surface">{% block login_content %}{% endblock %}</main>
</body>
</html>
