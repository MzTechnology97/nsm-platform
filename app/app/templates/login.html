{% extends "base.html" %}
{% block title %}Accesso · {{ app_name }}{% endblock %}
{% block login_content %}
<div class="login-wrap"><div class="login-card"><div class="login-brand"><span class="brand-mark large">NSM</span><div><h1>{{ app_name }}</h1><p>Network operations & security management</p></div></div>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post" action="/login" class="form-stack"><input type="hidden" name="csrf" value="{{ csrf_token(request) }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button primary large-button">Accedi</button></form><small class="login-version">NSM Core v{{ app_version }}</small></div></div>
{% endblock %}
