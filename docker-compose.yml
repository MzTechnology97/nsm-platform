name: network-security-platform

# GenieACS (TR-069 ACS), enabled with COMPOSE_PROFILES=acs in .env (see ./manage.sh acs-enable).
x-genieacs: &genieacs
  build: { context: ./genieacs }
  image: nsm-genieacs:1.2.16
  profiles: ["acs"]
  restart: unless-stopped
  environment:
    GENIEACS_MONGODB_CONNECTION_URL: mongodb://genieacs-mongo:27017/genieacs
    GENIEACS_EXT_DIR: /opt/genieacs/ext
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  depends_on:
    genieacs-mongo:
      condition: service_healthy
  networks: [platform]

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: nsp-postgres
    restart: unless-stopped
    env_file:
      - ./secrets/bootstrap.env
    environment:
      POSTGRES_USER: network_platform
      POSTGRES_DB: network_platform
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U network_platform -d network_platform"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [platform]

  redis:
    image: redis:8.10-alpine
    container_name: nsp-redis
    restart: unless-stopped
    env_file:
      - ./secrets/bootstrap.env
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$${REDIS_PASSWORD}\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]

  migrate:
    build: { context: ./app }
    container_name: nsp-migrate
    env_file:
      - ./.env
      - ./secrets/bootstrap.env
    command: ["sh", "-c", "alembic upgrade head && python -m app.db_roles"]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [platform]

  api:
    build: { context: ./app }
    container_name: nsp-api
    restart: unless-stopped
    env_file:
      - ./.env
      - ./secrets/bootstrap.env
    command: ["uvicorn", "app.entrypoint:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - ./data/backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [platform]

  worker:
    build: { context: ./app }
    container_name: nsp-worker
    restart: unless-stopped
    env_file:
      - ./.env
      - ./secrets/bootstrap.env
    command: ["python", "-m", "app.worker"]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - ./data/backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [platform]

  # Integrated syslog receiver (LOG-01): devices send warnings, errors and
  # logins to UDP/TCP 514; the process listens on 5514 as a non-root user.
  # Upload-only FTP receiver for legacy RouterOS backups (./manage.sh legacy-backup-enable <IP>).
  legacy-ftp:
    build: { context: ./app }
    container_name: nsp-legacy-ftp
    profiles: ["legacyftp"]
    restart: unless-stopped
    env_file:
      - ./.env
      - ./secrets/bootstrap.env
    command: ["python", "-m", "app.legacy_ftp_server"]
    volumes:
      - ./data/backups:/data/backups
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ports:
      - "${LEGACY_FTP_PORT:-2121}:2121/tcp"
      - "30100-30109:30100-30109/tcp"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [platform]

  syslog:
    build: { context: ./app }
    container_name: nsp-syslog
    restart: unless-stopped
    env_file:
      - ./.env
      - ./secrets/bootstrap.env
    environment:
      SYSLOG_PORT: "5514"
    # Hardened launcher: dedicated DB role, secrets it does not need removed.
    command: ["python", "-m", "app.syslog_main"]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ports:
      - "${SYSLOG_HOST_PORT:-514}:5514/udp"
      - "${SYSLOG_HOST_PORT:-514}:5514/tcp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [platform]

  caddy:
    image: caddy:2.11.4-alpine
    container_name: nsp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      # GenieACS panel behind NSM admin check (Amministrazione > ACS).
      - "${ACS_UI_PORT:-7080}:7080"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [platform]

  genieacs-mongo:
    image: mongo:7.0
    container_name: nsp-genieacs-mongo
    profiles: ["acs"]
    restart: unless-stopped
    volumes:
      - ./data/genieacs-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [platform]

  # CPE-facing CWMP endpoint (TR-069 ACS URL: http://<host>:7547).
  genieacs-cwmp:
    <<: *genieacs
    container_name: nsp-genieacs-cwmp
    command: ["genieacs-cwmp"]
    ports:
      - "7547:7547"

  # Northbound API read by NSM (http://genieacs-nbi:7557); never published on the host.
  genieacs-nbi:
    <<: *genieacs
    container_name: nsp-genieacs-nbi
    command: ["genieacs-nbi"]

  # File server for firmware/config files downloaded by the CPE.
  genieacs-fs:
    <<: *genieacs
    container_name: nsp-genieacs-fs
    command: ["genieacs-fs"]
    ports:
      - "7567:7567"

  # Administration UI, bound to the host loopback only (use an SSH tunnel).
  genieacs-ui:
    <<: *genieacs
    container_name: nsp-genieacs-ui
    command: ["genieacs-ui"]
    env_file:
      - ./secrets/bootstrap.env
    ports:
      - "127.0.0.1:3000:3000"

networks:
  platform:
    external: true
    name: network-platform-net

volumes:
  caddy_data:
  caddy_config:
