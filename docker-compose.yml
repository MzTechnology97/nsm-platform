name: network-security-platform

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: nsp-postgres
    restart: unless-stopped
    env_file:
      - ./secrets/bootstrap.env
    environment:
      POSTGRES_USER: network_platform
      POSTGRES_DB: network_platform
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U network_platform -d network_platform"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [platform]

  redis:
    image: redis:8.10-alpine
    container_name: nsp-redis
    restart: unless-stopped
    env_file:
      - ./secrets/bootstrap.env
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$${REDIS_PASSWORD}\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]

  migrate:
    build: { context: ./app }
    container_name: nsp-migrate
    env_file:
      - ./.env
      - ./secrets/bootstrap.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [platform]

  api:
    build: { context: ./app }
    container_name: nsp-api
    restart: unless-stopped
    env_file:
      - ./.env
      - ./secrets/bootstrap.env
    command: ["uvicorn", "app.entrypoint:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    volumes:
      - ./data/backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [platform]

  worker:
    build: { context: ./app }
    container_name: nsp-worker
    restart: unless-stopped
    env_file:
      - ./.env
      - ./secrets/bootstrap.env
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./data/backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [platform]

  caddy:
    image: caddy:2.11.4-alpine
    container_name: nsp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [platform]

networks:
  platform:
    external: true
    name: network-platform-net

volumes:
  caddy_data:
  caddy_config:
